name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
      - run: shellcheck deploy/*.sh settings/*.sh
      - run: for f in settings/*.json; do jq empty "$f"; done

  ci:
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.lint.result }}" = success
