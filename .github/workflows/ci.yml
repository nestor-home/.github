name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new commit on a pull request makes its earlier run moot: it is cancelled. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
      - run: shellcheck deploy/*.sh settings/*.sh
      - run: for f in settings/*.json; do jq empty "$f"; done

  ci:
    timeout-minutes: 2
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.lint.result }}" = success
