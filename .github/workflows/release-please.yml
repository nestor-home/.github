# Opens and updates the release pull request from Conventional Commits, and creates the tag and
# the GitHub Release when that pull request is merged. Callers publish in the same workflow run.
#
# release-please acts as the organization's GitHub App (variable RELEASE_APP_ID, secret
# RELEASE_APP_PRIVATE_KEY, so callers pass `secrets: inherit`): unlike GITHUB_TOKEN, its release
# pull requests run CI and its tags trigger workflows.
#
# The caller repository holds release-please-config.json and .release-please-manifest.json. With
# `automerge`, the release pull request is merged by GitHub as soon as its CI passes: what the
# repository publishes follows its dependencies without anyone merging it.
#
# Once a release is created, every earlier release of the repository is marked superseded at the
# top of its notes, with a link to the latest one. The registries are not touched: yanking needs
# credentials that trusted publishing does not give (crates.io, npm) or has no API at all (PyPI).
name: Release Please

on:
  workflow_call:
    inputs:
      automerge:
        description: Merge the release pull request once its CI passes.
        type: boolean
        default: false
    outputs:
      release_created:
        description: "'true' when this run created a release."
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The tag of the release, e.g. v0.2.0.
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: The version of the release, e.g. 0.2.0.
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  release-please:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write  # release-please labels and comments its pull requests through the issues API
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: inputs.automerge && steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.release.outputs.pr }}  # the release pull request, as JSON
        run: gh pr merge "$(jq -r .number <<< "$PR")" --repo "$GITHUB_REPOSITORY" --squash --auto
      - if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          marker='**Superseded.**'
          note="> $marker This release is no longer supported. Use the [latest release](https://github.com/$GITHUB_REPOSITORY/releases/latest)."
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name != \"$TAG\" and .draft == false and (.body // \"\" | contains(\"$marker\") | not)) | .id" |
          while read -r id; do
            body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.body // ""')
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f body="$note"$'\n\n'"$body" --jq .tag_name
          done
