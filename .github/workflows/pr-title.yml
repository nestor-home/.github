# Pull requests are squash-merged with their title as the commit message, so the title must follow
# Conventional Commits: release-please reads it to pick the next version and write the changelog.
name: PR title

on:
  workflow_call:

jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: Start the subject with a lowercase letter.
