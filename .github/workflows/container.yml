# Builds a container image for linux/amd64 and linux/arm64 on native runners, pushes it to
# ghcr.io/<owner>/<repository>, and attests its provenance.
#
# Tags: with `version` (a release), `X.Y.Z`, `X.Y` and `latest`; always the short commit sha.
# The caller grants: contents: read, packages: write, id-token: write, attestations: write.
name: Container image

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v (e.g. 0.2.0). Empty for an untagged build.
        type: string
        default: ""
      ref:
        description: Git ref to build. Defaults to the commit that triggered the caller.
        type: string
        default: ""
      context:
        type: string
        default: .
      file:
        type: string
        default: Dockerfile
      target:
        type: string
        default: ""
      artifact:
        description: Name of an artifact of the caller's run to download into the context first.
        type: string
        default: ""
      artifact-path:
        description: Where to put that artifact, relative to the context.
        type: string
        default: ""
    outputs:
      image:
        description: The image name, e.g. ghcr.io/nestor-home/nestor.
        value: ${{ jobs.merge.outputs.image }}
      digest:
        description: The digest of the multi-platform image.
        value: ${{ jobs.merge.outputs.digest }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.context }}/${{ inputs.artifact-path }}
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          platform='${{ matrix.platform }}'
          echo "slug=${platform//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.name.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.name.outputs.slug }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.name.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=sha
      - working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - id: inspect
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
